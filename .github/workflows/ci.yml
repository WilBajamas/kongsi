name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Only keep the latest run per branch; cancel superseded ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.0" # keep in sync with .fvmrc

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # sqlite3 ships its native lib via a Dart build hook; off by default.
      - run: flutter config --enable-native-assets
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test
      # Golden failures write diff images; surface them for download.
      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          retention-days: 7

  build-android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter config --enable-native-assets
      - name: Build APK (dev, unsigned debug)
        run: >
          flutter build apk --debug --flavor dev
          -t lib/main_dev.dart
          --dart-define-from-file=config/dev.example.json

  build-ios:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter config --enable-native-assets
      - name: Build iOS (compile-only, no codesign)
        run: >
          flutter build ios --no-codesign --debug
          -t lib/main_dev.dart
          --dart-define-from-file=config/dev.example.json
