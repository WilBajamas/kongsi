name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Only keep the latest run per branch; cancel superseded ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.0" # keep in sync with .fvmrc

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # sqlite3 ships its native lib via a Dart build hook; off by default.
      - run: flutter config --enable-native-assets
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test
      # Golden failures write diff images; surface them for download.
      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          retention-days: 7

  build-android:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel the other flavors when one fails — a flavor-specific
      # break is exactly what this matrix exists to surface.
      fail-fast: false
      matrix:
        include:
          - flavor: dev
            mode: debug
          - flavor: staging
            mode: debug
          # prod builds in RELEASE on purpose. Debug and release differ in ways
          # that have already bitten this project once: the Flutter template
          # declared INTERNET only in the debug manifest, so a release build
          # would have shipped with no network permission. A debug-only CI
          # would never have caught it. Release signing uses the debug key for
          # now (see android/app/build.gradle.kts), so this needs no secrets.
          - flavor: prod
            mode: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter config --enable-native-assets
      - name: Build APK (${{ matrix.flavor }}, ${{ matrix.mode }})
        run: >
          flutter build apk --${{ matrix.mode }} --flavor ${{ matrix.flavor }}
          -t lib/main_${{ matrix.flavor }}.dart
          --dart-define-from-file=config/${{ matrix.flavor }}.example.json

  build-ios:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter config --enable-native-assets
      # No --flavor here: iOS flavors need matching Xcode schemes/configs, and
      # only the default Runner scheme exists. This job's job is to prove the
      # iOS side still compiles (incl. the connectivity Swift stub) — add
      # schemes first if iOS ever needs per-flavor builds.
      - name: Build iOS (compile-only, no codesign)
        run: >
          flutter build ios --no-codesign --debug
          -t lib/main_dev.dart
          --dart-define-from-file=config/dev.example.json
